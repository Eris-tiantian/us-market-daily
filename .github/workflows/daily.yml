name: US Market Daily Report

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: us-market-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: cache
          key: market-bars-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            market-bars-${{ runner.os }}-

      - name: Install Chinese font and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f >/dev/null
          python -m pip install -r requirements-dev.txt

      - name: Verify implementation
        run: python -m pytest -q

      - name: Build, publish, verify and send
        id: daily
        env:
          GH_TOKEN: ${{ github.token }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python -m src.app run-github \
            --config config.yaml \
            --state .state/sent_session.txt \
            --output reports/latest.png \
            --meta reports/latest.json \
            --github-output reports/github_output.txt
          cat reports/github_output.txt >> "$GITHUB_OUTPUT"

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_id }}
          path: |
            reports/*.json
            reports/*.png
            reports/github_output.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Record skip
        if: steps.daily.outputs.should_send == 'false'
        run: echo "No new completed NYSE session; no notification sent."
