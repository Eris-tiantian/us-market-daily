timezone: Asia/Shanghai

data:
  provider: auto
  fallback_order: [factset, ftshare, yahoo]
  history_days: 900
  min_rows: 80
  retries: 3
  timeout_seconds: 30
  backoff_seconds: 1
  batch_size: 64
  max_workers: 8
  cache_dir: cache
  refresh_overlap_days: 14
  full_refresh_days: 30
  crosscheck: true
  max_price_deviation: 0.02
market: [SPY, QQQ, IWM]
risk:
  vix: "^VIX"
sectors:
  SMH: 半导体
  IGV: 软件
  XBI: 生物科技
  XLK: 科技
  XLC: 通讯
  XLY: 可选消费
  XLF: 金融
  XLI: 工业
  XLE: 能源
  XLB: 材料
  XLV: 医疗
  XLP: 必选消费
  XLU: 公用事业
  XLRE: 房地产
watchlist:
  fixed: [TEM, RXRX, ENPH]
scanner:
  enabled: true
  universe_source: nasdaq_directory
  exchanges: [NASDAQ, NYSE, AMEX]
  universe_cache_hours: 24
  universe_max_stale_hours: 72
  max_universe: null
  allow_partial_universe: false
  min_price: 5
  min_history_days: 252
  min_avg_dollar_volume_20d: 20000000
  max_candidates: 5
  max_ma30_distance: 0.20
  max_support_distance: 0.08
  max_r5: 0.12
  min_rr_space: 0.03
  require_rs60: true
  require_sector: true
  min_download_coverage: 0.90
  sector_overrides:
    TEM: XLV
    RXRX: XBI
    ENPH: XLK
stage:
  ma_weeks: 30
  slope_threshold: 0.0015
  slope_weeks: 4
  flat_band: 0.05
  early_stage_max_weeks: 6
  breakout_lookback: 26
  base_min_weeks: 8
  base_max_range: 0.18
  early_breakout_distance: 0.08
rs:
  benchmark: SPY
  periods: [20, 60, 120]
volume:
  avg_period: 20
  breakout_ratio: 1.3
levels:
  pivot_window: 5
  lookback_days: 252
  cluster_tolerance: 0.015
rr:
  minimum: 2.0
  stop_buffer: 0.01
report:
  title: 美股每日行情分析
  width: 1600
  height: 2200
  dpi: 150
